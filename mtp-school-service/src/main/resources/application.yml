server:
  port: 8087
  max-http-request-header-size: 8MB
spring:
  cloud:
    compatibility-verifier:
      enabled: false
  application:
    name: mtp-school-service
  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=MtpSchoolDB;encrypt=true;trustServerCertificate=true;loginTimeout=30;
    username: sa
    password: ${DB_PASSWORD:123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        tenant_identifier_resolver: com.mtp.school.config.tenant.TenantIdentifierResolver

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

logging:
  level:
    org.apache.coyote.http11: TRACE
    org.apache.tomcat.util.http: TRACE
    org.springframework.web: DEBUG
