spring.application.name=mtp-stock-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.compatibility-verifier.enabled=false

server.port=8082
server.max-http-request-header-size=8388608
server.tomcat.max-http-request-header-size=8388608
server.address=0.0.0.0

# SQL Server Connection 
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=MtpAppDB2018_full;encrypt=true;trustServerCertificate=true;loginTimeout=30;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Cloudinary Configuration
cloudinary.cloud_name=dprgqhdvb
cloudinary.api_key=466186697645622
cloudinary.api_secret=${CLOUDINARY_API_SECRET:8Or3UibUeqlzoIJyBXG5taHaRD8}

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.mtp.stock.config.tenant.TenantIdentifierResolver
grpc.server.port=9090


# Performance Optimizations
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Inter-service Communication
notification.service.url=http://localhost:8081
