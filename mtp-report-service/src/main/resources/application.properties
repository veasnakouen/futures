spring.application.name=mtp-report-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.compatibility-verifier.enabled=false

server.port=8086
server.max-http-request-header-size=8388608
server.tomcat.max-http-request-header-size=8388608
server.address=0.0.0.0

# SQL Server Connection 
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=MtpAppDB2018_full;encrypt=true;trustServerCertificate=true;loginTimeout=30;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Configuration (for validating auth headers)
jwt.secret=${JWT_SECRET:MTB_SECRET_KEY_2026_MODERN_SYSTEM_SECURE_KEY_1234567890}
jwt.expiration=2592000000

logging.level.com.mtp=INFO
