spring.application.name=mtp-hr-service
spring.main.allow-bean-definition-overriding=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.compatibility-verifier.enabled=false
server.port=8081
server.address=0.0.0.0
server.max-http-request-header-size=8388608
server.tomcat.max-http-request-header-size=8388608
server.tomcat.max-http-response-header-size=8388608
server.tomcat.relaxed-path-chars=<,>,[,],\\,^,`,{,|,}
server.tomcat.relaxed-query-chars=<,>,[,],\\,^,`,{,|,}
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB


# SQL Server Connection 
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=MtpAppDB2018_full;encrypt=true;trustServerCertificate=true;loginTimeout=30;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver


# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# Prevent Hibernate from trying to guess metadata if connection is slow
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# HikariCP Connection Pool (tuned for single SQL Server instance)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MtpHikariPool

# Java 21 Virtual Threads — eliminates thread-per-request overhead
spring.threads.virtual.enabled=false

# Actuator — health + metrics endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,logfile
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Caffeine cache stats exposed via actuator/metrics/cache.*
spring.cache.type=caffeine

# Structured logging
logging.file.name=spring-app.log
logging.level.com.mtp=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=DEBUG

# Jackson serialization
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration
jwt.secret=${JWT_SECRET:MTB_SECRET_KEY_2026_MODERN_SYSTEM_SECURE_KEY_1234567890}
jwt.expiration=2592000000

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dprgqhdvb}
cloudinary.api_key=${CLOUDINARY_API_KEY:466186697645622}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:8Or3UibUeqlzoIJyBXG5taHaRD8}

