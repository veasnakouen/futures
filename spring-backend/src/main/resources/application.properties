# logging.file.name=log/mylog.log # log file
spring.application.name=mtp-hr-service
spring.main.allow-bean-definition-overriding=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.compatibility-verifier.enabled=false
server.port=8081
server.address=0.0.0.0
server.max-http-request-header-size=8388608
server.tomcat.max-http-request-header-size=8388608
server.tomcat.max-http-response-header-size=8388608
server.tomcat.relaxed-path-chars=<,>,[,],\\,^,`,{,|,}
server.tomcat.relaxed-query-chars=<,>,[,],\\,^,`,{,|,}
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB


server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# SQL Server Connection 
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=MtpAppDB2018_full;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Password123!}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Prevent Hibernate from trying to guess metadata if connection is slow
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# HikariCP Connection Pool (tuned for single SQL Server instance)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MtpHikariPool

# Java 21 Virtual Threads — eliminates thread-per-request overhead
spring.threads.virtual.enabled=true

# Actuator — health + metrics + prometheus endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,logfile,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

# Caffeine cache stats exposed via actuator/metrics/cache.*
spring.cache.type=caffeine

# Structured logging
logging.file.name=spring-app.log
logging.level.com.mtp=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=DEBUG

# Jackson serialization
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration
jwt.secret=${JWT_SECRET:MTB_SECRET_KEY_2026_MODERN_SYSTEM_SECURE_KEY_1234567890}
jwt.expiration=2592000000

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dprgqhdvb}
cloudinary.api_key=${CLOUDINARY_API_KEY:466186697645622}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:8Or3UibUeqlzoIJyBXG5taHaRD8}

# =========================================================
# Network Resilience Configuration (Production)
# =========================================================

# Circuit Breaker — trip after repeated failures to prevent cascade
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.default.record-exceptions=java.io.IOException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

# Time Limiter — fail fast, don't let slow networks pile up threads
resilience4j.timelimiter.instances.default.timeout-duration=10s
resilience4j.timelimiter.instances.default.cancel-running-future=true

# Bulkhead — limit concurrent calls to prevent thread exhaustion
resilience4j.bulkhead.instances.default.max-concurrent-calls=50
resilience4j.bulkhead.instances.default.max-wait-duration=100ms

# Retry — retry transient network failures with backoff
resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=500ms
resilience4j.retry.instances.default.enable-exponential-backoff=true
resilience4j.retry.instances.default.exponential-backoff-multiplier=2
resilience4j.retry.instances.default.retry-exceptions=java.io.IOException,java.net.SocketTimeoutException

# HikariCP — tune connection pool for unreliable networks
# Quickly detect dead connections and replace them
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000
