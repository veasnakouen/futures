server:
  port: 8080
  address: 0.0.0.0
  max-http-request-header-size: 8388608
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  netty:
    max-initial-line-length: 8388608

spring:
  jpa:
    hibernate:
      ddl-auto: none
  application:
    name: mtp-api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
        pool:
          type: ELASTIC
          max-idle-time: 30000ms
          max-life-time: 60000ms
      default-filters:
        - name: RequestSize
          args:
            maxSize: 50000000
        - name: Retry
          args:
            retries: 3
            methods: GET
            backoff:
              firstBackoff: 200ms
              maxBackoff: 1000ms
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
              - "http://localhost:8080"
              - "http://127.0.0.1:8080"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: websocket-service
          uri: http://localhost:8081
          predicates:
            - Path=/ws/**
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**
        - id: stock-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/stock/**
        - id: school-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/school/**
        - id: core-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/**

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      backendCircuitBreaker:
        slidingWindowSize: 20           # Need 20 calls before evaluating
        failureRateThreshold: 60        # 60% failure rate to trip
        waitDurationInOpenState: 5s     # Recover faster (was 10s)
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 5         # Need at least 5 calls to evaluate
  timelimiter:
    instances:
      backendCircuitBreaker:
        timeoutDuration: 30s            # Allow slow first-requests after restart (was 15s)

jwt:
  secret: ${JWT_SECRET:MTB_SECRET_KEY_2026_MODERN_SYSTEM_SECURE_KEY_1234567890}
