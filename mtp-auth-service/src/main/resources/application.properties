spring.application.name=mtp-auth-service
server.port=8085
server.max-http-request-header-size=8388608
server.tomcat.max-http-request-header-size=8388608

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.compatibility-verifier.enabled=false

# SQL Server Connection
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=MtpAppDB2018_full;encrypt=true;trustServerCertificate=true;loginTimeout=30;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT Configuration
jwt.secret=MTB_SECRET_KEY_2026_MODERN_SYSTEM_SECURE_KEY_1234567890
jwt.expiration=2592000000

logging.level.com.mtp=INFO
